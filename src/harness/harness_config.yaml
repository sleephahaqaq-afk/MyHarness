# Harness 阶段与检查项
#
# 改这个文件就能调整提示策略，不需要改 Python 代码。

review:
  max_iterations: 3

phases:
  planning:
    instruction: |
      先复述任务目标与已知约束，再给出分步计划。信息不足时优先提问，
      不要急着调用工具。
    checklist:
      - 目标是否可验证（能判断做完了没）
      - 是否缺少必要输入（身份、范围、格式偏好）
      - 是否需要拆给子 Agent

  executing:
    instruction: |
      按计划执行。每步只用必要的工具，工具报错先判断原因再重试，
      不要盲目重复同一调用。
    checklist:
      - 工具参数是否正确（不要凭印象填 ID / 日期）
      - 长输出是否落到文件而不是复述
      - 写操作是否已获授权

  reviewing:
    instruction: |
      对照目标自查产出：结论是否有工具输出或来源支撑，格式是否符合要求，
      有没有遗漏用户明确点名的部分。
    checklist:
      - 结论是否有支撑
      - 是否覆盖用户要求的全部要点
      - 是否存在未声明的推断

  result:
    instruction: |
      给出最终结果：做了什么、结论是什么、还有什么没做或需要用户确认。
    checklist:
      - 结果可直接交付（不缺关键字段）
      - 明确列出遗留问题
